name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Translations
        run: python3 scripts/check-translations.py
      - name: Lint, unit tests, release bundle
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest bundleRelease assembleRelease
      - name: No network permissions
        run: scripts/check-manifest.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: app/build/reports
          retention-days: 7
